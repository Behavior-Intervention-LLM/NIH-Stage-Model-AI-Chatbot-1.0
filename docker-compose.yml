services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./local_storage:/app/local_storage
      - ./users.db:/app/users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./users.db:/app/users.db
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    env_file:
      - .env
    environment:
      - INGEST_INTERVAL_HOURS=168
      - EMBED_DEVICE=cpu
    volumes:
      - ./data/checkpoints:/app/data/checkpoints
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/app/data/checkpoints') else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
